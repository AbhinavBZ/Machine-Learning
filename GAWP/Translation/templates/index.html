
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Text Translation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>AI Text Translation</h1>
            <p>Powered by Helsinki-NLP MarianMT Transformer Models</p>
        </header>

        <main>

            <form method="POST">

                <div class="language-selection">

                    <div class="field">
                        <label for="source">Source Language</label>

                        <select name="source" id="source">
                            <option value="en"
                                {% if request.form.get('source', 'en') == 'en' %}selected{% endif %}>
                                English
                            </option>

                            <option value="hi"
                                {% if request.form.get('source') == 'hi' %}selected{% endif %}>
                                Hindi
                            </option>
                        </select>
                    </div>

                    <div class="swap-icon">⇄</div>

                    <div class="field">
                        <label for="target">Target Language</label>

                        <select name="target" id="target">
                            <option value="hi"
                                {% if request.form.get('target', 'hi') == 'hi' %}selected{% endif %}>
                                Hindi
                            </option>

                            <option value="en"
                                {% if request.form.get('target') == 'en' %}selected{% endif %}>
                                English
                            </option>
                        </select>
                    </div>

                </div>

                <div class="field">
                    <label for="text">Enter Your Text</label>

                    <textarea
                        name="text"
                        id="text"
                        rows="6"
                        placeholder="Type or paste your text here..."
                        required>{{ original or '' }}</textarea>
                </div>

                <button type="submit">
                    Translate Text →
                </button>

            </form>

            {% if result %}
            <section class="result-section">

                <h2>Translated Output</h2>

                <div class="result-box">
                    {{ result }}
                </div>

            </section>
            {% endif %}

        </main>

    </div>

</body>
</html>
